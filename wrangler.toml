name = "product-listing-process"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 前端靜態檔
[assets]
directory = "./public"
binding = "ASSETS"

# 資料庫：D1 product-listing-db（APAC）
[[d1_databases]]
binding = "DB"
database_name = "product-listing-db"
database_id = "a055ae4c-96d6-4a3a-8949-b16a280444c9"

# 照片儲存
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "product-listing-photos"
